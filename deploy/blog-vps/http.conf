upstream blog_vercel_http {
    zone blog_vercel_http 64k;
    resolver 127.0.0.53 valid=60s ipv6=off;
    resolver_timeout 5s;
    server 4d2296f58052b6fc.vercel-dns-017.com:80 resolve;
    keepalive 8;
}

server {
    listen 80;
    server_name blog.seanfield.org;

    # 由 Vercel 决定跳转，确保 HTTP-01 证书验证路径原样抵达源站。
    location / {
        proxy_pass http://blog_vercel_http;
        proxy_http_version 1.1;
        proxy_set_header Host blog.seanfield.org;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_cache off;
    }
}
