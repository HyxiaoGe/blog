# 443 入口按 SNI 转入这里；仅接收本机入口附带的 PROXY protocol。
# TLS 字节保持原样，证书、HTTP Host 和缓存仍由 Vercel 处理。
upstream blog_vercel_tls {
    zone blog_vercel_tls 64k;
    resolver 127.0.0.53 valid=60s ipv6=off;
    resolver_timeout 5s;
    server 4d2296f58052b6fc.vercel-dns-017.com:443 resolve;
}

log_format blog_relay '$time_iso8601 client=$proxy_protocol_addr upstream=$upstream_addr '
                      'status=$status sent=$bytes_sent received=$bytes_received duration=$session_time';

server {
    listen 127.0.0.1:19443 proxy_protocol;
    proxy_pass blog_vercel_tls;
    # Vercel 接收标准 TLS，不能带内部 PROXY protocol 头。
    proxy_protocol off;
    proxy_connect_timeout 5s;
    proxy_timeout 90s;
    access_log /var/log/nginx/blog-relay-access.log blog_relay;
}
