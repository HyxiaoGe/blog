<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="904" viewBox="0 0 1240 904" role="img" aria-label="四个飞书群的通知来源与发送路径"><title>四个飞书群的通知来源与发送路径</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#8d9388" stroke-width="1.4"/></marker></defs><rect width="1240" height="904" fill="#f8f5ed"/><text x="46" y="59" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" font-weight="650" fill="#27352e">四个飞书群，几条独立的通知链路</text><text x="46" y="94" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#69736a">按消息职责分流；采集、判断和投递由各自的程序完成。</text><text x="54" y="150" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="600" fill="#27352e">观察什么</text><text x="388" y="150" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="600" fill="#27352e">谁来处理 · 怎样发送</text><text x="931" y="150" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="600" fill="#27352e">发到哪里</text><rect x="44" y="179" width="283" height="129" rx="18" fill="#fffdf8" stroke="#dedbd0" stroke-width="2"/><rect x="369" y="179" width="484" height="129" rx="18" fill="#fffdf8" stroke="#dedbd0" stroke-width="2"/><rect x="898" y="179" width="296" height="129" rx="18" fill="#e4eee5" stroke="#dedbd0" stroke-width="2"/><path d="M 335 243 L 358 243" stroke="#8d9388" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M 863 243 L 887 243" stroke="#8d9388" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><text x="64" y="225" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#27352e">内部服务、容器、指标和日志</text><text x="64" y="259" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#27352e">Codex 任务与重置相关事件</text><text x="391" y="225" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#27352e">WatchMend：规则、事件状态、通知候选</text><text x="391" y="259" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#27352e">巡检 Webhook</text><text x="920" y="243" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="600" fill="#27352e">Dev巡检</text><rect x="44" y="338" width="283" height="129" rx="18" fill="#fffdf8" stroke="#dedbd0" stroke-width="2"/><rect x="369" y="338" width="484" height="129" rx="18" fill="#fffdf8" stroke="#dedbd0" stroke-width="2"/><rect x="898" y="338" width="296" height="129" rx="18" fill="#f7e8db" stroke="#dedbd0" stroke-width="2"/><path d="M 335 402 L 358 402" stroke="#8d9388" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M 863 402 L 887 402" stroke="#8d9388" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><text x="64" y="384" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#27352e">厂商状态页</text><text x="64" y="418" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#27352e">基础镜像清单</text><text x="391" y="384" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#27352e">WatchMend：状态变化 → Webhook</text><text x="391" y="418" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#27352e">Diun：写入文件 → 定时汇总 → Webhook</text><text x="920" y="402" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="600" fill="#27352e">上游服务状态</text><rect x="44" y="497" width="283" height="129" rx="18" fill="#fffdf8" stroke="#dedbd0" stroke-width="2"/><rect x="369" y="497" width="484" height="129" rx="18" fill="#fffdf8" stroke="#dedbd0" stroke-width="2"/><rect x="898" y="497" width="296" height="129" rx="18" fill="#e5eaf4" stroke="#dedbd0" stroke-width="2"/><path d="M 335 561 L 358 561" stroke="#8d9388" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M 863 561 L 887 561" stroke="#8d9388" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><text x="64" y="543" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#27352e">Mac 上的 CodexBar</text><text x="64" y="577" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#27352e">订阅额度与账户余额</text><text x="391" y="543" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#27352e">ai-cost-hub：晨报、阈值与状态去重</text><text x="391" y="577" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#27352e">launchd 调度 → 飞书 CLI</text><text x="920" y="561" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="600" fill="#27352e">AI 成本&amp;额度</text><rect x="44" y="656" width="283" height="129" rx="18" fill="#fffdf8" stroke="#dedbd0" stroke-width="2"/><rect x="369" y="656" width="484" height="129" rx="18" fill="#fffdf8" stroke="#dedbd0" stroke-width="2"/><rect x="898" y="656" width="296" height="129" rx="18" fill="#eee6f2" stroke="#dedbd0" stroke-width="2"/><path d="M 335 720 L 358 720" stroke="#8d9388" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><path d="M 863 720 L 887 720" stroke="#8d9388" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/><text x="64" y="702" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#27352e">HTTP / TCP 等可用性</text><text x="64" y="736" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#27352e">GitHub Actions 部署结果</text><text x="391" y="702" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#27352e">Uptime Kuma → 飞书通知</text><text x="391" y="736" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="400" fill="#27352e">部署收尾脚本 → Webhook</text><text x="920" y="703.5" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="600" fill="#27352e">Dev 基础设施</text><text x="920" y="736.5" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="600" fill="#27352e">与发布</text><text x="48" y="867" font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="400" fill="#69736a">Diun 和发布脚本各自投递；额度群使用应用机器人，不经过 WatchMend。</text></svg>
