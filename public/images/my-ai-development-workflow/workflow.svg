<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1220" viewBox="0 0 1440 1220" role="img" aria-labelledby="title desc">
  <title id="title">从需求到验收的 AI 研发工作流</title>
  <desc id="desc">我提出想法，让 AI 从产品角度整理需求、从测试角度准备用例，在 worktree 中开发并审查。合并后的最终提交经 Actions 构建镜像、推送 Harbor、部署自己的 dev。AI 执行用例，我体验功能，通过后记录结论并通知我。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#628575"/></marker></defs>
  <style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#293832}.title{font-size:48px;font-weight:700}.sub{font-size:26px;fill:#66736a}.name{font-size:32px;font-weight:650}.body{font-size:25px;fill:#58665e}.num{font-size:25px;fill:#ad5739;font-weight:700}.card{fill:#fffdf7;stroke:#dacdb8;stroke-width:2}.line{fill:none;stroke:#628575;stroke-width:4;marker-end:url(#arrow)}.small{font-size:24px;fill:#66736a}</style>
  <rect width="1440" height="1220" rx="30" fill="#f8f1e3"/>
  <circle cx="1350" cy="90" r="40" fill="#eac0a4" opacity=".55"/>
  <text x="64" y="86" class="title">从我的想法，到自己的 dev 验收</text>
  <text x="64" y="138" class="sub">我确认目标与结果 · AI 按产品、开发、审查和测试视角协作</text>

  <g transform="translate(64 200)"><rect class="card" width="390" height="210" rx="20"/><text x="26" y="44" class="num">01 / 从想法到需求</text><text x="26" y="90" class="name">我 + AI 产品角色</text><text x="26" y="140" class="body">整理需求，写入 Issue</text><text x="26" y="179" class="body">由我确认范围与关键规则</text></g>
  <path class="line" d="M462 305H516"/>
  <g transform="translate(525 200)"><rect class="card" width="390" height="210" rx="20"/><text x="26" y="44" class="num">02 / 先确定怎样验证</text><text x="26" y="90" class="name">AI 测试角色</text><text x="26" y="140" class="body">读取上下文，准备测试清单</text><text x="26" y="179" class="body">列出预期行为与待确认项</text></g>
  <path class="line" d="M923 305H977"/>
  <g transform="translate(986 200)"><rect class="card" width="390" height="210" rx="20"/><text x="26" y="44" class="num">03 / 开发与自检</text><text x="26" y="90" class="name">独立 worktree</text><text x="26" y="140" class="body">实现 → 检查 → 反馈 → 修正</text><text x="26" y="179" class="body">保留工具结果与相关测试</text></g>
  <path class="line" d="M1181 418V491"/>

  <g transform="translate(986 500)"><rect class="card" width="390" height="210" rx="20"/><text x="26" y="44" class="num">04 / 换一个角度检查</text><text x="26" y="90" class="name">AI 审查 + CI</text><text x="26" y="140" class="body">对照需求与当前代码改动</text><text x="26" y="179" class="body">通过检查后，由我确认合并</text></g>
  <path class="line" d="M978 605H924"/>
  <g transform="translate(525 500)"><rect width="390" height="210" rx="20" fill="#e5ede3" stroke="#a2b6a7" stroke-width="2"/><text x="26" y="44" class="num">05 / 合并后检查构建</text><text x="26" y="90" class="name">Actions → Harbor</text><text x="26" y="140" class="body">以主分支最终提交构建镜像</text><text x="26" y="179" class="body">记录提交与各镜像 digest</text></g>
  <path class="line" d="M517 605H463"/>
  <g transform="translate(64 500)"><rect class="card" width="390" height="210" rx="20"/><text x="26" y="44" class="num">06 / 部署自己的服务</text><text x="26" y="90" class="name">我的 dev 服务器</text><text x="26" y="140" class="body">拉取镜像，更新应用服务</text><text x="26" y="179" class="body">核对启动状态、镜像与配置</text></g>
  <path class="line" d="M259 718V791"/>

  <g transform="translate(64 800)"><rect width="390" height="210" rx="20" fill="#e5ede3" stroke="#a2b6a7" stroke-width="2"/><text x="26" y="44" class="num">07 / 执行功能验证</text><text x="26" y="90" class="name">AI 测试角色</text><text x="26" y="140" class="body">操作 dev 接口和浏览器用例</text><text x="26" y="179" class="body">对照预期，留下实际证据</text></g>
  <path class="line" d="M462 905H516"/>
  <g transform="translate(525 800)"><rect class="card" width="390" height="210" rx="20"/><text x="26" y="44" class="num">08 / 真实使用体验</text><text x="26" y="90" class="name">我走一遍关键流程</text><text x="26" y="140" class="body">交互是否顺手，反馈是否清楚</text><text x="26" y="179" class="body">是否解决最初想处理的问题</text></g>
  <path class="line" d="M923 905H977"/>
  <g transform="translate(986 800)"><rect class="card" width="390" height="210" rx="20"/><text x="26" y="44" class="num">09 / 留下本轮结论</text><text x="26" y="90" class="name">Issue + 飞书</text><text x="26" y="140" class="body">记录版本、用例和验收结果</text><text x="26" y="179" class="body">通过后关闭任务，通知我</text></g>

  <rect x="64" y="1065" width="1312" height="102" rx="18" fill="#f0d9c8"/>
  <text x="90" y="1109" font-size="28" font-weight="650">失败反馈：定位原因 → 补充证据 → 返回对应环节处理</text>
  <text x="90" y="1148" class="small">修复产生新提交后，重新生成对应的检查、镜像与验收记录。</text>
</svg>
